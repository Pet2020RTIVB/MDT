<script>
const $=id=>document.getElementById(id),W=1400,H=990,cv=$('cv'),ctx=cv.getContext('2d');
cv.width=W*2;cv.height=H*2;
let pages=[{s:[]}],cur=0,tool='pen',undo=[],redo=[],blinkOn=true,cs=null,lock=null,mode=null,drag=null,angPts=[],comp={c:null,r:0,set:false};
const R=[{x:60,y:430,a:0,k:1,l:[[0,0],[520,0],[0,520]],v:false},{x:760,y:430,a:0,k:1,l:[[0,0],[620,0],[0,358]],v:false}];
let sel=R[0];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const wp=(r,q)=>{const c=Math.cos(r.a),s=Math.sin(r.a),k=r.k||1;return[r.x+k*(q[0]*c-q[1]*s),r.y+k*(q[0]*s+q[1]*c)]};
const verts=r=>r.l.map(q=>wp(r,q));
function segD(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function inTri(r,p){const v=verts(r),s=(a,b)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]),d=[s(v[0],v[1]),s(v[1],v[2]),s(v[2],v[0])];return d.every(x=>x>=0)||d.every(x=>x<=0)}
function findEdge(p){let best=null,bd=22;R.filter(r=>r.v).forEach(r=>{const v=verts(r);for(let i=0;i<3;i++){const a=v[i],b=v[(i+1)%3],d=segD(p,a,b);if(d<bd){bd=d;best=[a,b]}}});return best}
function proj(p,e){const[a,b]=e,dx=b[0]-a[0],dy=b[1]-a[1],t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);return[a[0]+t*dx,a[1]+t*dy]}
const st=()=>({w:+$('w').value,a:+$('al').value/100,g:Math.round(255*(1-$('dk').value/100)),d:$('ln').value,col:COL||undefined});
const pos=e=>{const r=cv.getBoundingClientRect(),p=[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];return tool=='lin'&&$('gs').checked?gsn(p):p};
const pushU=()=>{dirty=true;redo.length=0;undo.push(JSON.stringify(pages));if(undo.length>60)undo.shift()};
const msg=t=>{const s=$('st');s.textContent=t;s.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>s.classList.remove('show'),4000)};
const mm=px=>px.toFixed(0)+' px ('+(px*297/1400).toFixed(1)+' mm)';
function snap(p){let b=null,bd=14;pages[cur].s.forEach(s=>{(s.t=='c'||s.t=='t'?[s.c]:s.t=='n'?s.p:[s.p[0],s.p[s.p.length-1]]).forEach(q=>{const d=dist(p,q);if(d<bd){bd=d;b=q}})});return b?[b[0],b[1]]:p}

function drawS(s){
 if(s.t=='t'){ctx.save();ctx.setLineDash([]);const[x,y]=s.c;ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x-3.5,y-3.5);ctx.lineTo(x+3.5,y+3.5);ctx.moveTo(x+3.5,y-3.5);ctx.lineTo(x-3.5,y+3.5);ctx.stroke();ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeText(s.l,x+5,y-5);ctx.fillStyle='#111';ctx.fillText(s.l,x+5,y-5);ctx.restore();return}
 ctx.save();ctx.globalAlpha=s.a*((s.d=='b'&&!blinkOn)?.08:1);
 const col=s.col||`rgb(${s.g},${s.g},${s.g})`;ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=s.w;ctx.lineCap=ctx.lineJoin='round';
 ctx.setLineDash(s.d=='d'?[s.w*4+8,s.w*3+6]:[]);ctx.beginPath();
 if(s.t=='c')ctx.arc(s.c[0],s.c[1],s.r,0,7);
 else if(s.t=='n'){
  const[a,v,b]=s.p,a1=Math.atan2(a[1]-v[1],a[0]-v[0]),a2=Math.atan2(b[1]-v[1],b[0]-v[0]);
  let df=((a2-a1+3*Math.PI)%(2*Math.PI))-Math.PI;
  ctx.moveTo(a[0],a[1]);ctx.lineTo(v[0],v[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.beginPath();
  ctx.arc(v[0],v[1],38,a1,a1+df,df<0);ctx.stroke();ctx.setLineDash([]);ctx.font='bold 18px system-ui';ctx.textAlign='center';
  const m=a1+df/2;ctx.fillText((Math.abs(df)*180/Math.PI).toFixed(1)+'°',v[0]+62*Math.cos(m),v[1]+62*Math.sin(m)+6);
  ctx.restore();return}
 else{s.p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(s.p.length==1)ctx.lineTo(s.p[0][0],s.p[0][1])}
 ctx.stroke();ctx.restore()}

function redraw(){
 ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 if($('gr').checked){ctx.lineWidth=1;for(let i=0;i<=W;i+=25){ctx.strokeStyle=i%100?'rgba(60,110,180,.10)':'rgba(60,110,180,.22)';ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let j=0;j<=H;j+=25){ctx.strokeStyle=j%100?'rgba(60,110,180,.10)':'rgba(60,110,180,.22)';ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke()}}
 drawGrid();drawBg();pages[cur].s.forEach(drawS);if(cs)drawS(cs);
 R.forEach(r=>{if(!r.v)return;const v=verts(r);ctx.beginPath();v.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
  ctx.fillStyle='rgba(90,150,210,.20)';ctx.fill();ctx.strokeStyle=r==sel?'rgba(20,80,180,.95)':'rgba(20,80,180,.55)';ctx.lineWidth=r==sel?2.5:1.5;ctx.stroke();ticks(r)});
 ctx.lineWidth=1.5;ctx.strokeStyle='#d33';ctx.fillStyle='#d33';
 if((tool=='comp'||tool=='mov')&&comp.c){ctx.beginPath();ctx.arc(comp.c[0],comp.c[1],4,0,7);ctx.fill();if(comp.r){ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(comp.c[0],comp.c[1],comp.r,0,7);ctx.stroke();ctx.setLineDash([]);const t=comp.tip||[comp.c[0]+comp.r,comp.c[1]],hg=[(comp.c[0]+t[0])/2-(t[1]-comp.c[1])*.9,(comp.c[1]+t[1])/2+(t[0]-comp.c[0])*.9];ctx.save();ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(comp.c[0],comp.c[1]);ctx.lineTo(hg[0],hg[1]);ctx.lineTo(t[0],t[1]);ctx.stroke();ctx.fillStyle='#555';ctx.beginPath();ctx.arc(hg[0],hg[1],7,0,7);ctx.fill();ctx.restore()}}
 angPts.forEach(q=>{ctx.beginPath();ctx.arc(q[0],q[1],5,0,7);ctx.fill()});drawSel();drawHud();
}
setInterval(()=>{blinkOn=!blinkOn;if(pages[cur].s.some(s=>s.d=='b')||cs&&cs.d=='b')redraw()},550);

function fit(p){const n=p.length;let mx=0,my=0;p.forEach(q=>{mx+=q[0]/n;my+=q[1]/n});
 let Suu=0,Suv=0,Svv=0,A=0,B=0;p.forEach(q=>{const u=q[0]-mx,v=q[1]-my;Suu+=u*u;Suv+=u*v;Svv+=v*v;A+=u*u*u+u*v*v;B+=v*v*v+v*u*u});
 const D=Suu*Svv-Suv*Suv;if(Math.abs(D)<1e-6)return null;
 const uc=(A/2*Svv-B/2*Suv)/D,vc=(B/2*Suu-A/2*Suv)/D,r=Math.sqrt(uc*uc+vc*vc+(Suu+Svv)/n);
 return r>3&&isFinite(r)?{c:[mx+uc,my+vc],r}:null}
function length(p){let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1],p[i]);return L}
function fix(s){
 let p=s.p.map((q,i,a)=>{if(!i||i==a.length-1)return q;const a0=Math.max(0,i-3),b0=Math.min(a.length-1,i+3);let x=0,y=0;for(let j=a0;j<=b0;j++){x+=a[j][0];y+=a[j][1]}const n=b0-a0+1;return[x/n,y/n]});
 const L=length(p),d=dist(p[0],p[p.length-1]);
 if(L>25&&d/L>.96){let a=p[0],b=p[p.length-1];const g=Math.atan2(b[1]-a[1],b[0]-a[0]),sn=Math.round(g/(Math.PI/4))*Math.PI/4;if(Math.abs(g-sn)<.07)b=[a[0]+d*Math.cos(sn),a[1]+d*Math.sin(sn)];return{...s,p:[a,b]}}
 if(L>120&&d<.2*L){const c=fit(p);if(c){let e=0;p.forEach(q=>e+=Math.abs(dist(q,c.c)-c.r));if(e/p.length/c.r<.12){const{p:_,...o}=s;return{...o,t:'c',c:c.c,r:c.r}}}}
 return{...s,p}}
const smooth=p=>p.map((q,i,a)=>{if(!i||i==a.length-1)return q;const a0=Math.max(0,i-3),b0=Math.min(a.length-1,i+3);let x=0,y=0;for(let j=a0;j<=b0;j++){x+=a[j][0];y+=a[j][1]}const n=b0-a0+1;return[x/n,y/n]});
const resid=(p,c)=>p.reduce((s,q)=>s+Math.abs(dist(q,c.c)-c.r),0)/p.length/c.r;
function rdp(p,e){if(p.length<3)return p;let m=0,k=0;const a=p[0],b=p[p.length-1];for(let i=1;i<p.length-1;i++){const d=segD(p[i],a,b);if(d>m){m=d;k=i}}return m>e?rdp(p.slice(0,k+1),e).slice(0,-1).concat(rdp(p.slice(k),e)):[a,b]}
function resamp(p,n){const L=length(p),o=[];let i=1,acc=0;for(let k=0;k<n;k++){const tg=L*k/n;while(i<p.length-1&&acc+dist(p[i-1],p[i])<tg){acc+=dist(p[i-1],p[i]);i++}const sl=dist(p[i-1],p[i])||1,t=Math.min(1,(tg-acc)/sl);o.push([p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t])}return o}
function rect(v){const ang=i=>{const a=v[(i+3)%4],b=v[i],c=v[(i+1)%4],x=Math.atan2(a[1]-b[1],a[0]-b[0])-Math.atan2(c[1]-b[1],c[0]-b[0]);return Math.abs(((x+3*Math.PI)%(2*Math.PI))-Math.PI)*180/Math.PI};
 if(![0,1,2,3].every(i=>Math.abs(ang(i)-90)<14))return v;
 const m=[0,1].map(k=>v.reduce((s,q)=>s+q[k]/4,0));let th=Math.atan2((v[1][1]-v[0][1])+(v[2][1]-v[3][1]),(v[1][0]-v[0][0])+(v[2][0]-v[3][0]));const r=th-Math.round(th/(Math.PI/2))*Math.PI/2;if(Math.abs(r)<.1)th-=r;
 const u=[Math.cos(th),Math.sin(th)],w=[-u[1],u[0]];let hu=0,hw=0;v.forEach(q=>{hu+=Math.abs((q[0]-m[0])*u[0]+(q[1]-m[1])*u[1])/4;hw+=Math.abs((q[0]-m[0])*w[0]+(q[1]-m[1])*w[1])/4});
 if(Math.abs(hu-hw)<.1*Math.max(hu,hw))hu=hw=(hu+hw)/2;
 return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>[m[0]+a*hu*u[0]+b*hw*w[0],m[1]+a*hu*u[1]+b*hw*w[1]])}
function ell(p){const r=resamp(p,72),n=72;let mx=0,my=0;r.forEach(q=>{mx+=q[0]/n;my+=q[1]/n});let sx=0,sy=0,sxy=0;r.forEach(q=>{const x=q[0]-mx,y=q[1]-my;sx+=x*x/n;sy+=y*y/n;sxy+=x*y/n});
 let ph=.5*Math.atan2(2*sxy,sx-sy);const r0=ph-Math.round(ph/(Math.PI/2))*Math.PI/2;if(Math.abs(r0)<.1)ph-=r0;
 const c=Math.cos(ph),s=Math.sin(ph);let l1=0,l2=0;r.forEach(q=>{const x=q[0]-mx,y=q[1]-my,u=x*c+y*s,w=-x*s+y*c;l1+=u*u/n;l2+=w*w/n});
 const a=Math.sqrt(2*l1),b=Math.sqrt(2*l2);if(b<8)return null;let e=0;r.forEach(q=>{const x=q[0]-mx,y=q[1]-my,u=x*c+y*s,w=-x*s+y*c;e+=Math.abs(Math.hypot(u/a,w/b)-1)/n});
 if(e>.12)return null;const o=[];for(let i=0;i<72;i++){const t=i*Math.PI/36;o.push([mx+a*Math.cos(t)*c-b*Math.sin(t)*s,my+a*Math.cos(t)*s+b*Math.sin(t)*c])}return o}
function recog(s,force){
 const p=smooth(s.p),L=length(p),d=dist(p[0],p[p.length-1]),mk=(q,cl)=>({...s,t:'p',p:cl?[...q,q[0]]:q});
 if(L<25)return{...s,p};
 if(!force&&d/L>.96){let a=p[0],b=p[p.length-1];const g=Math.atan2(b[1]-a[1],b[0]-a[0]),sn=Math.round(g/(Math.PI/4))*Math.PI/4;if(Math.abs(g-sn)<.07)b=[a[0]+d*Math.cos(sn),a[1]+d*Math.sin(sn)];return{...s,p:[a,b]}}
 const q=rdp(p,Math.max(4,.012*L)),c=fit(p),rs=c?resid(p,c):9;
 if(force||d<.15*L){

async function exportJSON(){if(!nb)return;const imgs={};for(const p of pages)if(p.bg&&!imgs[p.bg.id]){const r=await kvx('get','img:'+p.bg.id);if(r)imgs[p.bg.id]=await blobURL(new Blob([r.buf],{type:r.type}))}
 dl(safe(nb.name)+'.json',JSON.stringify({app:'mesa-dibujo-tecnico',v:2,name:nb.name,pages,imgs},jr));msg('Archivo preparado. Revísalo en tus descargas.')}
async function importData(j){if(!Array.isArray(j.pages)||!j.pages.every(p=>Array.isArray(p.s)))throw 0;const map={};
 for(const p of j.pages){if(!p.bg)continue;const u=j.imgs&&j.imgs[p.bg.id];if(!u){delete p.bg;continue}if(!map[p.bg.id]){const nid=uid(),bin=atob(u.split(',')[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);await kvx('set','img:'+nid,{buf:a.buffer,type:u.slice(5,u.indexOf(';'))});map[p.bg.id]=nid}p.bg.id=map[p.bg.id]}return j.pages}
const mkImg=(buf,type)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(new Blob([buf],{type}))});
const fitBg=(id,im)=>{const k=Math.min((W-40)/im.naturalWidth,(H-40)/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;return{id,x:(W-w)/2,y:(H-h)/2,w,h,a:1}};
async function setBg(f){if(!f||!/^image\//.test(f.type)){msg('Elige una imagen (PNG, JPG…).');return}
 try{const ab=f.arrayBuffer?f.arrayBuffer():new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsArrayBuffer(f)});const buf=await ab,id=uid(),im=await mkImg(buf,f.type);await kvx('set','img:'+id,{buf,type:f.type});IMGS[id]=im;pushU();pages[cur].bg=fitBg(id,im);dirty=true;$('bga').value=100;document.querySelector('[data-k=bg]').click();msg('Lámina añadida: arrástrala o escala con dos dedos.')}catch(e){msg('No se pudo cargar esa imagen.')}}
function drawBg(){const b=pages[cur].bg;if(!b)return;const im=IMGS[b.id];if(im&&im.complete){ctx.save();ctx.globalAlpha=b.a;ctx.drawImage(im,b.x,b.y,b.w,b.h);ctx.restore()}else if(im===undefined){IMGS[b.id]=null;kvx('get','img:'+b.id).then(r=>r&&mkImg(r.buf,r.type)).then(i=>{if(i){IMGS[b.id]=i;redraw()}}).catch(()=>{})}}
const gsn=p=>{const s=($('gk').value=='m10'?10:5)*W/297;return[Math.round(p[0]/s)*s,Math.round(p[1]/s)*s]};
function drawGrid(){const t=$('gk').value;if(t=='n')return;const K=W/297;ctx.save();ctx.lineWidth=1;
 if(t=='iso'){const s=10*K,sy=s/Math.cos(Math.PI/6),tn=Math.tan(Math.PI/6);ctx.strokeStyle='rgba(60,110,180,.2)';ctx.beginPath();for(let x=0;x<=W;x+=s){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let k=-Math.ceil(W*tn/sy);k*sy<=H;k++){ctx.moveTo(0,k*sy);ctx.lineTo(W,k*sy+W*tn)}for(let k=0;k*sy<=H+W*tn;k++){ctx.moveTo(0,k*sy);ctx.lineTo(W,k*sy-W*tn)}ctx.stroke()}
 else{const s=(t=='m10'?10:5)*K;for(let i=0;i*s<=W;i++){ctx.strokeStyle=i%5?'rgba(60,110,180,.1)':'rgba(60,110,180,.24)';ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,H);ctx.stroke()}for(let j=0;j*s<=H;j++){ctx.strokeStyle=j%5?'rgba(60,110,180,.1)':'rgba(60,110,180,.24)';ctx.beginPath();ctx.moveTo(0,j*s);ctx.lineTo(W,j*s);ctx.stroke()}}ctx.restore()}
function ticks(r){const K=W/297,k=r.k||1,L1=r.l[1][0],L2=r.l[2][1];ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.scale(k,k);ctx.strokeStyle=ctx.fillStyle='rgba(20,60,140,.8)';ctx.lineWidth=1/k;ctx.font='9px -apple-system,system-ui,sans-serif';ctx.beginPath();
 for(let i=1;i*K<L1;i++){const x=i*K,l=i%10==0?15:i%5==0?10:5;ctx.moveTo(x,0);ctx.lineTo(x,l);if(i%10==0)ctx.fillText(i/10,x-3,27)}
 for(let i=1;i*K<L2;i++){const y=i*K,l=i%10==0?15:i%5==0?10:5;ctx.moveTo(0,y);ctx.lineTo(l,y);if(i%10==0)ctx.fillText(i/10,19,y+3)}ctx.stroke();ctx.restore()}
function drawHud(){let t=null,p=null;if(cs&&tool=='lin'&&cs.p.length>1){const[a,b]=cs.p;t=(dist(a,b)*297/W).toFixed(1)+' mm · '+((-Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI%360+360)%360).toFixed(1)+'°';p=b}else if(mode=='setr'&&comp.tip){t='r = '+(comp.r*297/W).toFixed(1)+' mm';p=comp.tip}
 if(!t)return;ctx.save();ctx.font='600 15px -apple-system,system-ui,sans-serif';const w=ctx.measureText(t).width+16;ctx.fillStyle='rgba(30,30,34,.88)';ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,p[0]+14,p[1]-36,w,24,12);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(t,p[0]+22,p[1]-19);ctx.restore()}
lab('gr').style.display='none';$('gr').checked=false;

grp('bgg',mb('Añadir imagen',()=>$('bgf').click()),mb('−',()=>bgS(zb(1/1.1)),'Reducir'),mb('+',()=>bgS(zb(1.1)),'Ampliar'),mb('Ajustar',()=>bgS(b=>{const im=IMGS[b.id];if(im)Object.assign(b,fitBg(b.id,im),{a:b.a})}),'Ajustar a la hoja'),lo,mb('Quitar',()=>bgS(()=>{delete pages[cur].bg})));
